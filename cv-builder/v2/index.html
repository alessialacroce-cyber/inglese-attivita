<style>
/* Layout: workbench a due colonne — a sinistra il banco di lavoro (controlli + sezioni), a destra il foglio A4 che si aggiorna dal vivo. */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --surface-2: #f6f8f9;
  --line: #d5dce1;
  --fg: #1b2329;
  --muted: #5b6872;
  --accent: #1f5f8b;
  --accent-ink: #ffffff;
  --ok: #2f7d4f;
  --ok-bg: #e3f2e8;
  --warn: #9a5b00;
  --warn-bg: #fdf0d9;
  --accent-soft: #e4eef6;
  --hard: #1f5f8b; --hard-bg: #e4eef6; --soft: #7a3e8c; --soft-bg: #f3e8f6;
  --bad: #b3261e;
  --bad-bg: #fbe4e2;
  /* il foglio resta carta bianca in entrambi i temi */
  --paper: #ffffff;
  --ink: #1d1d1f;
  --ink-soft: #55595f;
  --cv-accent: #1f5f8b;
  --font-ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-label: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171b; --surface: #1a2126; --surface-2: #20282e; --line: #33404a;
    --fg: #e4e9ec; --muted: #9aa8b2; --accent: #6fb1e0; --accent-ink: #0d1a24;
    --ok: #7fd19d; --ok-bg: #1d3326; --warn: #f0b860; --warn-bg: #3a2c14;
    --bad: #f2948d; --bad-bg: #3d1e1c;
    --accent-soft: #1c2c38; --hard: #8cc3ea; --hard-bg: #1c2c38; --soft: #d6a6e4; --soft-bg: #2e2034;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171b; --surface: #1a2126; --surface-2: #20282e; --line: #33404a;
  --fg: #e4e9ec; --muted: #9aa8b2; --accent: #6fb1e0; --accent-ink: #0d1a24;
  --ok: #7fd19d; --ok-bg: #1d3326; --warn: #f0b860; --warn-bg: #3a2c14;
  --bad: #f2948d; --bad-bg: #3d1e1c;
  --accent-soft: #1c2c38; --hard: #8cc3ea; --hard-bg: #1c2c38; --soft: #d6a6e4; --soft-bg: #2e2034;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-ui); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- barra superiore ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-size: 18px; letter-spacing: .01em; }
.brand span { font: 12px var(--font-label); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
  padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.done { border-color: var(--ok); color: var(--ok); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.done-steps { display: flex; flex-direction: column; gap: 12px; }
.done-step { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
.done-step.ok { border-color: var(--ok); background: var(--ok-bg); }
.done-step p { margin: 0; }
.done-step .row { display: flex; flex-wrap: wrap; gap: 6px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); }
.btn.small { padding: 3px 8px; font-size: 13px; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }

/* ---------- area di lavoro ---------- */
.workspace {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 20px;
  padding-inline: 16px; padding-block: 20px 60px; max-width: 1500px; margin: 0 auto;
}
.editor { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.preview-col { min-width: 0; }
.preview-sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: flex; flex-direction: column; gap: 10px; }
.tabs { display: none; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.panel > header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
}
.panel > header h2 { margin: 0; font-size: 15px; margin-right: auto; text-wrap: balance; }
.panel .body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font: 11px var(--font-label); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field textarea, .field select {
  width: 100%; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-2); padding: 7px 9px;
}
.field textarea { resize: vertical; min-height: 70px; }
.field input:focus, .field textarea:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

/* sezioni */
.sec-title { font-weight: 700; border: 1px solid transparent; background: transparent; padding: 3px 6px; border-radius: var(--radius); min-width: 0; flex: 1 1 160px; }
.sec-title:hover, .sec-title:focus { border-color: var(--line); background: var(--surface-2); outline: none; }
.kind { font: 11px var(--font-label); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; }
.entry { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
.entry-head { display: flex; align-items: center; gap: 8px; }
.entry-head .eyebrow { margin-right: auto; }

.add-row { display: flex; flex-wrap: wrap; gap: 6px; }
.add-row .btn { font-size: 13px; }

/* chip skill */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; border-radius: 99px; padding: 2px 10px; border: 1px solid; }
button.chip { cursor: pointer; font-size: 12.5px; }
button.chip:hover { text-decoration: underline; }
.howto { display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--line); padding-top: 12px; }
.howto-title { margin: 0; font-weight: 700; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.skill-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.skill-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 7px 10px; border-radius: var(--radius); font-size: 14px; }
.skill-row.ok { background: var(--ok-bg); }
.skill-row.warn { background: var(--warn-bg); }
.skill-row .sk { font-weight: 700; }
.skill-row.ok .st { color: var(--ok); }
.skill-row.warn .st { color: var(--warn); }
.skill-row .st { margin-right: auto; min-width: 0; }
.check-line { font-size: 13.5px; margin: 0; }
.check-line.ok { color: var(--ok); }
.check-line.warn { color: var(--warn); }
.entry.flash { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.chip.ok { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }

/* controlli */
.score { display: flex; align-items: center; gap: 12px; }
.meter { flex: 1; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.score b { font: 600 14px var(--font-label); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; font-size: 14px; align-items: start; }
.checks .dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 2px; }
.checks .ok .dot { background: var(--ok-bg); color: var(--ok); }
.checks .warn .dot { background: var(--warn-bg); color: var(--warn); }
.checks .bad .dot { background: var(--bad-bg); color: var(--bad); }
.checks small { display: block; color: var(--muted); font-size: 12.5px; }
details.tips summary { cursor: pointer; color: var(--accent); font-size: 14px; }
details.tips ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }

/* stile CV */
.style-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }

.example-flag { font-size: 13px; background: var(--warn-bg); color: var(--warn); border-radius: var(--radius); padding: 8px 12px; }

/* ---------- foglio A4 ---------- */
.sheet-frame { overflow: hidden; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 30px rgba(20,40,60,.12); background: var(--paper); }
.sheet-scaler { transform-origin: top left; width: 210mm; }
.sheet {
  width: 210mm; min-height: 297mm; padding: 16mm 17mm; background: var(--paper); color: var(--ink);
  font-size: 10pt; line-height: 1.42;
}
.page-note { font: 12px var(--font-label); color: var(--muted); text-align: center; }

.cv-name { margin: 0; font-size: 24pt; line-height: 1.1; text-wrap: balance; }
.cv-headline { margin: 3pt 0 0; font-size: 11.5pt; color: var(--cv-accent); font-weight: 600; }
.cv-contacts { margin: 7pt 0 0; color: var(--ink-soft); font-size: 9.3pt; display: flex; flex-wrap: wrap; gap: 2pt 0; }
.cv-contacts span + span::before { content: "|"; margin: 0 6pt; color: #b5b9be; }
.cv-section { margin-top: 13pt; break-inside: auto; }
.cv-section h2 { margin: 0 0 6pt; font-size: 10.5pt; text-transform: uppercase; letter-spacing: .08em; color: var(--cv-accent); }
.cv-item { margin-bottom: 8pt; break-inside: avoid; }
.cv-item:last-child { margin-bottom: 0; }
.cv-row { display: flex; justify-content: space-between; gap: 10pt; align-items: baseline; }
.cv-row strong { font-size: 10.5pt; }
.cv-date { white-space: nowrap; color: var(--ink-soft); font-size: 9.3pt; font-variant-numeric: tabular-nums; }
.cv-org { color: var(--ink-soft); }
.cv-item ul, .cv-list { margin: 3pt 0 0; padding-left: 13pt; }
.cv-item li, .cv-list li { margin-bottom: 1.5pt; }
.cv-skillline { margin: 0 0 2pt; }
.cv-skillline b { font-weight: 600; }
.cv-text { margin: 0; white-space: pre-line; }
.cv-used { margin: 3pt 0 0; font-size: 9pt; color: var(--ink-soft); }

/* Tecnico — per meccanica: sans tecnica, filetto sotto i titoli come una quota */
.cv-tecnico { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }
.cv-tecnico .cv-header { border-bottom: 1.2pt solid var(--cv-accent); padding-bottom: 9pt; }
.cv-tecnico .cv-section h2 { border-bottom: .5pt solid #c9ced3; padding-bottom: 2pt; }
/* Grafico — per grafica: titoli grandi e compatti, accento come blocco tipografico */
.cv-grafico { font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; }
.cv-grafico .cv-name { font-size: 28pt; font-weight: 800; letter-spacing: -.02em; }
.cv-grafico .cv-header { border-left: 5pt solid var(--cv-accent); padding-left: 10pt; }
.cv-grafico .cv-section h2 { letter-spacing: .14em; font-weight: 800; color: var(--ink); }
.cv-grafico .cv-section h2::after { content: ""; display: block; width: 22pt; height: 2.5pt; background: var(--cv-accent); margin-top: 3pt; }
/* Classico — serif sobrio, va bene per qualsiasi candidatura */
.cv-classico { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
.cv-classico .cv-header { text-align: center; }
.cv-classico .cv-contacts { justify-content: center; }
.cv-classico .cv-section h2 { text-align: left; border-bottom: .5pt solid var(--ink); padding-bottom: 2pt; color: var(--ink); }
.cv-classico .cv-headline { color: var(--ink-soft); font-style: italic; font-weight: 400; }

/* ---------- dizionario ---------- */
.dict { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100vw); z-index: 40; background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(20,40,60,.15); display: flex; flex-direction: column; gap: 10px; padding-inline: 16px; padding-block: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-bottom, 0px) + 14px); }
.dict[hidden] { display: none !important; }
.dict-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.dict-head b { font-size: 16px; }
.dict-head .btn { margin-left: auto; }
#dict-q { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); padding: 8px 10px; }
#dict-q:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.dict-cats { display: flex; flex-wrap: wrap; gap: 5px; }
.dchip { font-size: 12.5px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 2px 9px; cursor: pointer; }
.dchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dict-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; display: flex; flex-direction: column; }
.dict-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.dword { display: flex; flex-direction: column; min-width: 0; }
.dit { font-size: 13.5px; color: var(--muted); }
.den { font-weight: 700; }
.dnote { font-size: 12.5px; color: var(--muted); font-style: italic; }
.dempty { color: var(--muted); grid-template-columns: 1fr !important; }
@media (min-width: 1100px) { body.dict-open { padding-right: 400px; } }
@media print { .dict { display: none !important; } body.dict-open { padding-right: 0; } }

/* ---------- avvio ed esempio da guardare (v2) ---------- */
.start[hidden], .viewbar[hidden] { display: none !important; }
.start { padding-inline: 16px; padding-block: 40px; display: flex; justify-content: center; }
.start-box { max-width: 560px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.start-box h1 { margin: 0; font-size: 22px; text-wrap: balance; }
.start-box > p { margin: 0; color: var(--muted); }
.start-options { display: flex; flex-direction: column; gap: 10px; }
.start-opt { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.start-opt:hover { border-color: var(--accent); }
.start-opt b { font-size: 16px; }
.start-opt span { font-size: 13.5px; color: var(--muted); }
.start-opt.primary { border: 2px solid var(--accent); }
.viewbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--warn-bg); color: var(--fg); border-bottom: 1px solid var(--line); }
.viewbar p { margin: 0; max-width: 70ch; }
.viewbar-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
body[data-mode="start"] .topbar .actions, body[data-mode="start"] .tabs, body[data-mode="start"] main { display: none !important; }
body[data-mode="example"] .topbar .actions, body[data-mode="example"] .tabs, body[data-mode="example"] .editor { display: none !important; }
body[data-mode="example"] .workspace { grid-template-columns: minmax(0, 860px); justify-content: center; }
body[data-mode="example"] .preview-col { display: block !important; }
body[data-mode="example"] .sheet { user-select: none; -webkit-user-select: none; }

/* ---------- bullet point guidati (v2) ---------- */
.points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.point { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: start; border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; background: var(--surface); font-size: 14px; }
.point p { margin: 0; }
.tag { display: inline-block; font: 11px var(--font-label); text-transform: uppercase; letter-spacing: .05em; border-radius: 99px; padding: 1px 7px; margin-right: 6px; vertical-align: 1px; }
.tag.hard { color: var(--hard); background: var(--hard-bg); }
.tag.soft { color: var(--soft); background: var(--soft-bg); }
.builder { border: 2px solid var(--accent); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); }
.builder h3 { margin: 0; font-size: 15px; }
.substep { display: flex; flex-direction: column; gap: 8px; }
.substep.done { opacity: .75; }
.substep-title { margin: 0; font-size: 14px; font-weight: 700; color: var(--accent); }
.typeinfo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.typebtn { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.typebtn b { font-size: 14px; }
.typebtn span { font-size: 12.5px; color: var(--muted); }
.typebtn[aria-pressed="true"].hard { border-color: var(--hard); background: var(--hard-bg); }
.typebtn[aria-pressed="true"].soft { border-color: var(--soft); background: var(--soft-bg); }
.q { display: flex; flex-direction: column; gap: 5px; }
.q label { font-size: 13.5px; }
.q label b { color: var(--accent); }
.q input { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); padding: 6px 9px; }
.bchips { display: flex; flex-wrap: wrap; gap: 5px; }
.bchip { font-size: 12.5px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 2px 9px; cursor: pointer; }
.bchip:hover { border-color: var(--accent); }
.bchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.bresult { background: var(--accent-soft); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.bresult label { font-size: 13px; font-weight: 700; }
.bresult textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 7px 9px; min-height: 64px; resize: vertical; }
.btips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.btips .ok { color: var(--ok); }
.btips .tip { color: var(--muted); }
.btips .stop { color: var(--warn); font-weight: 700; }
.exbox { border: 1px dashed var(--line); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.exparts { margin: 0; padding-left: 20px; font-size: 13.5px; display: flex; flex-direction: column; gap: 2px; }
.exparts b { color: var(--accent); }
.autoskills { display: flex; flex-direction: column; gap: 8px; }
.autoskills .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.autoskills .lbl { font-weight: 700; min-width: 90px; }
.askill { font-size: 13px; border-radius: 99px; padding: 2px 10px; border: 0; cursor: pointer; }
.askill.hard { color: var(--hard); background: var(--hard-bg); }
.askill.soft { color: var(--soft); background: var(--soft-bg); }
.askill:hover { text-decoration: underline; }
@media (max-width: 520px) { .typeinfo { grid-template-columns: minmax(0, 1fr); } }

/* ---------- dialog ---------- */
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--fg); max-width: min(560px, calc(100vw - 32px)); width: 100%; padding: 0; }
dialog::backdrop { background: rgba(10, 20, 30, .45); }
dialog .body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
dialog h3 { margin: 0; font-size: 17px; }
dialog p { margin: 0; }
dialog textarea { width: 100%; min-height: 180px; font: 12px var(--font-label); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); padding: 8px; }
dialog .field textarea { font: 15px/1.5 var(--font-ui); min-height: 80px; }
dialog .foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: var(--radius); font-size: 14px; z-index: 50; }

/* ---------- responsive ---------- */
@media (max-width: 960px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .tabs { display: flex; gap: 6px; padding-inline: 16px; padding-block: 12px 0; }
  .tabs .seg { width: 100%; }
  .tabs .seg button { flex: 1; }
  body[data-view="edit"] .preview-col { display: none; }
  body[data-view="preview"] .editor { display: none; }
  .preview-sticky { position: static; }
  .topbar { position: static; }
}
@media (max-width: 520px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }

/* ---------- stampa / PDF ---------- */
@page { size: A4; margin: 0; }
@media print {
  body { background: #fff; }
  .topbar, .tabs, .editor, .page-note, .toast, dialog { display: none !important; }
  .workspace { display: block; padding: 0; max-width: none; }
  .preview-col { display: block !important; }
  .preview-sticky { position: static; }
  .sheet-frame { box-shadow: none; overflow: visible; height: auto !important; }
  .sheet-scaler { transform: none !important; }
  .sheet { min-height: 0; }
}
</style>
</head>

<script>
(() => {
  "use strict";
  const STORE_KEY = "cvlab.v2";
  const uid = () => Math.random().toString(36).slice(2, 9);
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let embedded = false;
  try { embedded = window.self !== window.top; } catch (e) { embedded = true; }

  /* ---------- tipi di sezione ---------- */
  const KINDS = {
    text:    { label: "Paragrafo" },
    entries: { label: "Esperienze" },
    skills:  { label: "Competenze" },
    list:    { label: "Elenco" }
  };
  const PRESETS = [
    { kind: "text",    en: "Profile",            it: "Profilo" },
    { kind: "entries", en: "Work Experience",    it: "Esperienze lavorative" },
    { kind: "entries", en: "Internships (PCTO)", it: "Stage e PCTO" },
    { kind: "entries", en: "Projects",           it: "Progetti" },
    { kind: "entries", en: "Education",          it: "Istruzione" },
    { kind: "skills",  en: "Skills",             it: "Competenze" },
    { kind: "list",    en: "Languages",          it: "Lingue" },
    { kind: "list",    en: "Certifications",     it: "Certificazioni" },
    { kind: "list",    en: "Interests",          it: "Interessi" }
  ];
  const ACCENTS = ["#1f5f8b", "#2d6a4f", "#8a3b12", "#5b3f8c", "#333a40"];

  const blankEntry = () => ({ id: uid(), title: "", org: "", place: "", start: "", end: "", bullets: "", points: [] });
  const pt = (type, skill, text) => ({ id: uid(), type, skill, text });
  const newSection = (kind, title) => {
    const s = { id: uid(), kind, title };
    if (kind === "text") s.text = "";
    if (kind === "entries") s.items = [blankEntry()];
    if (kind === "skills" || kind === "list") s.lines = "";
    return s;
  };

  /* ---------- esempi (dati inventati, segnalati come tali) ---------- */
  const EXAMPLES = {
    meccanica: {
      example: true,
      meta: { style: "tecnico", accent: "#1f5f8b", lang: "en", field: "meccanica" },
      header: { name: "Marco Esempio", headline: "Mechanical Technician – CNC & CAD", email: "marco.esempio@email.it", phone: "+39 333 000 0000", city: "Bergamo, Italy", links: "linkedin.com/in/marco-esempio" },
      sections: [
        { id: uid(), kind: "text", title: "Profile", text: "Final-year mechanical student with shop-floor experience on CNC lathes. I read technical drawings, set up machines and check parts with precision instruments. Looking for a junior CNC operator or technical office role." },
        { id: uid(), kind: "entries", title: "Internships (PCTO)", items: [
          { id: uid(), title: "CNC Operator Intern", org: "Officine Rossi S.r.l.", place: "Dalmine (BG)", start: "Jun 2025", end: "Jul 2025", bullets: "", points: [
            pt("hard", "CNC machining", "Set up and ran a CNC lathe to produce steel shafts from technical drawings"),

    },
    grafica: {

      sections: [
        { id: uid(), kind: "text", title: "Profile", text: "Graphic design student who loves clean layouts and print. During my internships I worked on brand identities and social campaigns for local businesses. Looking for a junior role in a design studio or agency." },
        { id: uid(), kind: "entries", title: "Internships (PCTO)", items: [

            pt("hard", "Brand identity", "Designed the logo and brand guidelines for a local bakery in Illustrator"),
            pt("hard", "Adobe InDesign", "Laid out a 24-page product catalogue for offset printing"),

        ]},
        { id: uid(), kind: "entries", title: "Projects", items: [

        ]},
        { id: uid(), kind: "entries", title: "Education", items: [
          { id: uid(), title: "Diploma in Graphics and Communication", org: "IIS \"Esempio\"", place: "Milan", start: "2021", end: "2026", bullets: "", points: [] }
        ]},
        { id: uid(), kind: "skills", title: "Skills", lines: "" },
        { id: uid(), kind: "list", title: "Languages", lines: "Italian – native\nEnglish – B1" }
      ]
    }
  };

  const blankCV = () => ({
    example: false,
    meta: { style: "tecnico", accent: ACCENTS[0], lang: "en", field: "meccanica" },
    header: { name: "", headline: "", email: "", phone: "", city: "", links: "" },
    sections: [
      newSection("text", "Profile"),
      newSection("entries", "Work Experience"),
      newSection("entries", "Education"),
      newSection("skills", "Skills"),
      newSection("list", "Languages")
    ]
  });
  const clone = o => JSON.parse(JSON.stringify(o));
  const freshIds = cv => { cv.sections.forEach(s => { s.id = uid(); (s.items || []).forEach(i => { i.id = uid(); (i.points || []).forEach(x => x.id = uid()); }); }); return cv; };
  // rende compatibili i CV salvati prima (anche quelli della versione 1)
  const normalizeCv = c => {
    c.meta = Object.assign({ style: "tecnico", accent: ACCENTS[0], lang: "en", field: "meccanica" }, c.meta);
    c.sections.forEach(s => (s.items || []).forEach(it => { if (!Array.isArray(it.points)) it.points = []; if (typeof it.bullets !== "string") it.bullets = ""; }));
    return c;
  };

  /* ---------- stato ---------- */
  let cv;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) cv = JSON.parse(raw); } catch (e) {}
  // "edit" = si scrive il proprio CV · "start" = scelta iniziale · "example" = esempio da guardare (non si salva)
  let mode = "start";
  if (!cv || !cv.sections || cv.example) cv = blankCV();
  normalizeCv(cv);

  let saveTimer;
  const persist = () => {
    if (mode !== "edit") return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(cv)); } catch (e) {} }, 300);
  };

  /* ---------- analisi: skill collegate alle esperienze ---------- */
  const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
  const splitList = s => String(s || "").split(/[,;]/).map(x => x.trim()).filter(Boolean);
  const parseSkillLine = line => {
    const i = line.indexOf(":");
    return i > -1 ? { label: line.slice(0, i).trim(), skills: splitList(line.slice(i + 1)) } : { label: "", skills: splitList(line) };
  };
  const lines = s => String(s || "").split("\n").map(x => x.replace(/^\s*[-•*]\s*/, "").trim()).filter(Boolean);

  const ACTION_VERBS = ("achieved analysed analyzed assembled assisted built calibrated checked coached collaborated completed configured coordinated created cut delivered designed developed drafted drew edited fixed handled helped illustrated improved increased inspected installed laid launched led machined maintained managed measured modelled modeled monitored operated optimised optimized organised organized photographed planned prepared presented printed produced programmed prototyped ran redesigned reduced repaired retouched rewrote set solved supported taught tested trained updated welded won wrote " +
    "aggiornato analizzato assemblato calibrato collaborato completato configurato controllato coordinato creato curato disegnato fotografato gestito illustrato impaginato installato lavorato manutenuto migliorato misurato modellato montato organizzato ottimizzato pianificato preparato presentato prodotto programmato progettato realizzato ridotto riparato saldato scritto sviluppato stampato testato verificato vinto").split(" ");

  function experienceEntries() {
    const out = [];
    cv.sections.forEach(s => { if (s.kind === "entries") (s.items || []).forEach((it, i) => out.push({ sec: s, it, n: i + 1 })); });
    return out;
  }
  const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  function skillRegex(n) {
    const core = n.replace(/-/g, " ").split(" ").filter(Boolean).map(reEsc).join("[\\s-]?");
    return new RegExp("(^|[^a-z0-9])" + core + "s?(?![a-z0-9])");
  }
  const mentions = (skill, sentence) => {
    const n = norm(skill), t = norm(sentence);
    if (skillRegex(n).test(t)) return true;
    // "teamwork" scritto "team work": confronto senza spazi né trattini
    const c = n.replace(/[\s-]/g, "");
    return c.length >= 6 && t.replace(/[\s-]/g, "").includes(c);
  };
  const hasContent = it => it.title.trim() || it.bullets.trim() || (it.points || []).length;
  // tutte le skill dimostrate nei bullet point, divise in hard e soft
  function collectSkills() {
    const out = { hard: [], soft: [] };
    experienceEntries().forEach(({ it }) => (it.points || []).forEach(x => {
      const list = out[x.type];
      if (!list || !x.skill.trim()) return;
      const f = list.find(y => norm(y.skill) === norm(x.skill));
      if (f) f.where.push(it.id); else list.push({ skill: x.skill.trim(), where: [it.id] });
    }));
    return out;
  }
  function analyse() {
    const h = cv.header;
    const checks = [];
    const add = (state, text, note) => checks.push({ state, text, note });
    const words = document.getElementById("sheet").textContent.split(/\s+/).filter(Boolean).length;

    add(h.name.trim() ? "ok" : "bad", "Nome e cognome in alto", h.name.trim() ? "" : "È la prima cosa che un selezionatore cerca.");
    add(h.headline.trim() ? "ok" : "warn", "Titolo professionale sotto il nome", h.headline.trim() ? "" : "Es. “Junior CNC Operator” o “Junior Graphic Designer”: aiuta l'ATS a capire il ruolo.");
    const contacts = [h.email, h.phone].filter(x => x.trim()).length;
    add(contacts === 2 ? "ok" : "bad", "Email e telefono presenti", contacts === 2 ? "" : "Senza contatti nessuno può chiamarti. Usa un'email seria (nome.cognome).");

    const exps = experienceEntries().filter(({ it }) => hasContent(it));
    add(exps.length ? "ok" : "bad", "Almeno un'esperienza o un progetto", exps.length ? `${exps.length} voci trovate` : "Stage, PCTO, progetti scolastici e lavoretti contano tutti.");

    const allBullets = exps.flatMap(({ it }) => (it.points || []).map(x => x.text).concat(lines(it.bullets)));
    if (allBullets.length) {
      const withVerb = allBullets.filter(b => { const w = norm(b).split(" ")[0].replace(/[^a-z]/g, ""); return ACTION_VERBS.some(v => w === v) || (w.length > 4 && w.endsWith("ed")); }).length;
      add(withVerb / allBullets.length >= .7 ? "ok" : "warn", `Bullet point che iniziano con un verbo d'azione: ${withVerb} su ${allBullets.length}`, withVerb / allBullets.length >= .7 ? "" : "Inizia ogni bullet point con un verbo al passato: Designed, Planned, Checked…");
    }

    const sk = collectSkills();
    const nh = sk.hard.length, ns = sk.soft.length;
    add(nh && ns ? "ok" : "warn", `Skill dimostrate nei bullet point: ${nh} hard, ${ns} soft`, nh && ns ? "" : "Premi “Aiutami a scrivere un bullet point” in un'esperienza: serve almeno una hard e una soft skill.");
    const work = exps.filter(({ sec, it }) => !/educa|istruz|school|scuola/i.test(sec.title) && !(it.points || []).length);
    if (work.length) add("warn", `Esperienze senza skill dimostrate: ${work.length}`, `Es. “${work[0].it.title || work[0].sec.title}”: aggiungi almeno un bullet point guidato.`);

    const lenOk = words >= 150 && words <= 650;
    add(lenOk ? "ok" : "warn", `Lunghezza: circa ${words} parole`, lenOk ? "Bene per un CV di una pagina." : words < 150 ? "Un po' corto: descrivi meglio cosa hai fatto." : "Troppo lungo: per uno studente basta una pagina.");

    const score = Math.round(checks.reduce((a, c) => a + (c.state === "ok" ? 1 : c.state === "warn" ? .5 : 0), 0) / checks.length * 100);
    return { checks, score, skills: sk };
  }

  /* ---------- rendering editor ---------- */
  const fld = (label, path, value, opts = {}) => {
    const id = "f-" + path.replace(/\./g, "-");
    const tag = opts.area
      ? `<textarea id="${id}" data-bind="${path}" rows="${opts.rows || 3}" placeholder="${esc(opts.ph || "")}">${esc(value)}</textarea>`
      : `<input id="${id}" data-bind="${path}" value="${esc(value)}" placeholder="${esc(opts.ph || "")}"${opts.type ? ` type="${opts.type}"` : ""}>`;
    return `<div class="field"${opts.span ? ' style="grid-column:1/-1"' : ""}><label for="${id}">${label}</label>${tag}${opts.hint ? `<p class="hint">${opts.hint}</p>` : ""}</div>`;
  };

  function sectionBody(s, si) {
    const p = `sections.${si}`;
    if (s.kind === "text") {
      return fld("Testo", `${p}.text`, s.text, { area: true, rows: 4, ph: "3–4 frasi: chi sei, cosa sai fare, che lavoro cerchi." });
    }
    if (s.kind === "list") {
      return fld("Una voce per riga", `${p}.lines`, s.lines, { area: true, rows: 3, ph: "English – B2\nItalian – native" });
    }
    if (s.kind === "skills") {
      return `<p class="hint">Questa sezione si compone da sola con le skill dei tuoi bullet point. Per aggiungerne una, vai in un'esperienza e premi <b>Aiutami a scrivere un bullet point</b>. Tocca una skill per vedere dove la dimostri.</p>
        <div class="autoskills" data-autoskills="${s.id}"></div>`;
    }
    // entries
    const items = (s.items || []).map((it, ii) => {
      if (!Array.isArray(it.points)) it.points = [];
      const q = `${p}.items.${ii}`;
      return `<div class="entry" id="entry-${it.id}">
        <div class="entry-head"><span class="eyebrow">Voce ${ii + 1}</span>
          <button class="btn ghost small" type="button" data-act="item-up" data-si="${si}" data-ii="${ii}" aria-label="Sposta su">↑</button>
          <button class="btn ghost small" type="button" data-act="item-down" data-si="${si}" data-ii="${ii}" aria-label="Sposta giù">↓</button>
          <button class="btn ghost small danger" type="button" data-act="item-del" data-si="${si}" data-ii="${ii}">Elimina</button>
        </div>
        <div class="grid2">
          ${fld("Ruolo / titolo", `${q}.title`, it.title, { ph: "CNC Operator Intern" })}
          ${fld("Azienda / scuola", `${q}.org`, it.org, { ph: "Officine Rossi S.r.l." })}
          ${fld("Luogo", `${q}.place`, it.place, { ph: "Bergamo" })}
          <div class="grid2">${fld("Inizio", `${q}.start`, it.start, { ph: "Jun 2025" })}${fld("Fine", `${q}.end`, it.end, { ph: "Present" })}</div>
        </div>
        <div class="substep">
          <p class="substep-title" style="color:var(--fg)">Describe your activity</p>
          <p class="hint">Ogni bullet point racconta una cosa che hai fatto e la skill che dimostra.</p>
          ${(it.points || []).length ? `<ul class="points">${it.points.map((x, pi) => `<li class="point"><p><span class="tag ${x.type}">${x.type}</span><b>${esc(x.skill)}:</b> ${esc(x.text)}</p>
            <div style="display:flex;gap:2px"><button class="btn ghost small" type="button" data-pact="edit" data-item="${it.id}" data-pi="${pi}">Modifica</button><button class="btn ghost small" type="button" data-pact="del" data-item="${it.id}" data-pi="${pi}" aria-label="Elimina bullet point">×</button></div></li>`).join("")}</ul>` : ""}
          ${bld && bld.itemId === it.id ? builderHTML(it) : `<div><button class="btn primary small" type="button" data-bact="build" data-item="${it.id}">Aiutami a scrivere un bullet point</button></div>`}
          ${fld("Altre cose che hai fatto (facoltativo) · una per riga", `${q}.bullets`, it.bullets, { area: true, rows: 2, ph: "Frasi che non dimostrano una skill, es. Presented the project at the school open day" })}
        </div>
      </div>`;
    }).join("");
    return items + `<div><button class="btn small" type="button" data-act="item-add" data-si="${si}">+ Aggiungi voce</button></div>`;
  }

  function renderEditor() {
    const h = cv.header;
    const ed = $("#editor");
    const presetBtns = PRESETS.map((p, i) => `<button class="btn" type="button" data-act="sec-add" data-preset="${i}">+ ${esc(cv.meta.lang === "it" ? p.it : p.en)}</button>`).join("");
    ed.innerHTML = `
      ${cv.example ? `<div class="example-flag">Questo è un <b>CV di esempio</b> con dati inventati. Modificalo pure, oppure premi <b>Nuovo CV</b> per partire da zero.</div>` : ""}

      <div class="panel" id="panel-checks">
        <header><h2>Controllo CV · ATS e selezionatori</h2><span class="eyebrow">si aggiorna mentre scrivi</span></header>
        <div class="body">
          <div class="score"><div class="meter"><i id="meter-fill"></i></div><b id="score-num"></b></div>
          <ul class="checks" id="checks"></ul>
          <details class="tips"><summary>Regole d'oro per superare ATS e persone</summary>
            <ul>
              <li>Una sola colonna, titoli di sezione standard (Experience, Education, Skills): l'ATS li riconosce.</li>
              <li>Niente foto, grafici, tabelle o testo dentro immagini: l'ATS non li legge.</li>
              <li>Usa le parole chiave dell'annuncio, ma solo se sono vere e dimostrate.</li>
              <li>Ogni skill va dimostrata da un'esperienza reale: “dove l'ho usata? per chi? come?”.</li>
              <li>Ogni bullet point: <b>Skill:</b> verbo d'azione + cosa hai fatto + per chi + come.</li>
              <li>Una pagina, file PDF, nome file chiaro: <i>Nome-Cognome-CV.pdf</i>.</li>
            </ul>
          </details>
        </div>
      </div>

      <div class="panel">
        <header><h2>Aspetto</h2></header>
        <div class="body">
          <div class="style-row">
            <span class="eyebrow">Stile</span>
            <div class="seg" role="group" aria-label="Stile del CV">
              ${["tecnico", "grafico", "classico"].map(st => `<button type="button" data-act="style" data-style="${st}" aria-pressed="${cv.meta.style === st}">${st[0].toUpperCase() + st.slice(1)}</button>`).join("")}
            </div>
          </div>
          <div class="style-row">
            <span class="eyebrow">Colore</span>
            ${ACCENTS.map(c => `<button type="button" class="swatch" style="background:${c}" data-act="accent" data-color="${c}" aria-pressed="${cv.meta.accent === c}" aria-label="Colore ${c}"></button>`).join("")}
          </div>
          <div class="style-row">
            <span class="eyebrow">Indirizzo (per suggerimenti ed esempi)</span>
            <div class="seg" role="group" aria-label="Indirizzo">
              <button type="button" data-act="field" data-field="grafica" aria-pressed="${cv.meta.field === "grafica"}">Grafica</button>
              <button type="button" data-act="field" data-field="meccanica" aria-pressed="${cv.meta.field === "meccanica"}">Meccanica</button>
            </div>
          </div>
          <div class="style-row">
            <span class="eyebrow">Lingua dei titoli suggeriti</span>
            <div class="seg" role="group" aria-label="Lingua">
              <button type="button" data-act="lang" data-lang="en" aria-pressed="${cv.meta.lang === "en"}">English</button>
              <button type="button" data-act="lang" data-lang="it" aria-pressed="${cv.meta.lang === "it"}">Italiano</button>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <header><h2>Intestazione</h2></header>
        <div class="body"><div class="grid2">
          ${fld("Nome e cognome", "header.name", h.name, { ph: "Mario Rossi" })}
          ${fld("Titolo professionale", "header.headline", h.headline, { ph: "Junior Mechanical Technician" })}
          ${fld("Email", "header.email", h.email, { ph: "mario.rossi@email.it", type: "email" })}
          ${fld("Telefono", "header.phone", h.phone, { ph: "+39 333 123 4567", type: "tel" })}
          ${fld("Città", "header.city", h.city, { ph: "Bergamo, Italy" })}
          ${fld("LinkedIn / portfolio", "header.links", h.links, { ph: "linkedin.com/in/mario-rossi" })}
        </div></div>
      </div>

      ${cv.sections.map((s, si) => `
        <div class="panel" data-sec="${s.id}">
          <header>
            <input class="sec-title" id="sec-title-${s.id}" data-bind="sections.${si}.title" value="${esc(s.title)}" aria-label="Titolo della sezione">
            <span class="kind">${KINDS[s.kind].label}</span>
            <button class="btn ghost small" type="button" data-act="sec-up" data-si="${si}" aria-label="Sposta sezione su">↑</button>
            <button class="btn ghost small" type="button" data-act="sec-down" data-si="${si}" aria-label="Sposta sezione giù">↓</button>
            <button class="btn ghost small danger" type="button" data-act="sec-del" data-si="${si}">Elimina</button>
          </header>
          <div class="body">${sectionBody(s, si)}</div>
        </div>`).join("")}

      <div class="panel">
        <header><h2>Aggiungi una sezione</h2></header>
        <div class="body">
          <div class="add-row">${presetBtns}</div>
          <p class="eyebrow" style="margin:4px 0 0">Sezione personalizzata</p>
          <div class="add-row">
            ${Object.entries(KINDS).map(([k, v]) => `<button class="btn" type="button" data-act="sec-custom" data-kind="${k}">+ ${v.label}</button>`).join("")}
          </div>
          <p class="hint">Paragrafo = testo libero · Esperienze = voci con bullet point guidati · Competenze = si compone da sola dalle skill dei bullet point · Elenco = una voce per riga. Rinomina la sezione cliccando sul titolo.</p>
        </div>
      </div>`;
    refresh();
  }

  /* ---------- rendering CV ---------- */
  function renderSheet() {
    const h = cv.header;
    const sheet = $("#sheet");
    sheet.className = "sheet cv-" + cv.meta.style;
    sheet.style.setProperty("--cv-accent", cv.meta.accent);
    const contacts = [h.email, h.phone, h.city, h.links].filter(x => x && x.trim()).map(x => `<span>${esc(x)}</span>`).join("");
    const body = cv.sections.map(s => {
      let inner = "";
      if (s.kind === "text") { if (!s.text.trim()) return ""; inner = `<p class="cv-text">${esc(s.text.trim())}</p>`; }
      if (s.kind === "list") { const ls = lines(s.lines); if (!ls.length) return ""; inner = `<ul class="cv-list">${ls.map(l => `<li>${esc(l)}</li>`).join("")}</ul>`; }
      if (s.kind === "skills") {
        const sk = collectSkills();
        if (!sk.hard.length && !sk.soft.length) return "";
        inner = (sk.hard.length ? `<p class="cv-skillline"><b>Hard skills:</b> ${esc(sk.hard.map(x => x.skill).join(", "))}</p>` : "") +
                (sk.soft.length ? `<p class="cv-skillline"><b>Soft skills:</b> ${esc(sk.soft.map(x => x.skill).join(", "))}</p>` : "");
      }
      if (s.kind === "entries") {
        const its = (s.items || []).filter(it => hasContent(it) || it.org.trim());
        if (!its.length) return "";
        inner = its.map(it => {
          const dates = [it.start, it.end].filter(x => x.trim()).join(" – ");
          const org = [it.org, it.place].filter(x => x.trim()).join(", ");
          const bl = (it.points || []).map(x => `<b>${esc(x.skill)}:</b> ${esc(x.text)}`).concat(lines(it.bullets).map(esc));
          return `<div class="cv-item">
            <div class="cv-row"><strong>${esc(it.title)}</strong>${dates ? `<span class="cv-date">${esc(dates)}</span>` : ""}</div>
            ${org ? `<div class="cv-org">${esc(org)}</div>` : ""}
            ${bl.length ? `<ul>${bl.map(b => `<li>${b}</li>`).join("")}</ul>` : ""}
          </div>`;
        }).join("");
      }
      return `<section class="cv-section"><h2>${esc(s.title)}</h2>${inner}</section>`;
    }).join("");
    sheet.innerHTML = `<header class="cv-header">
        <h1 class="cv-name">${esc(h.name) || "Nome Cognome"}</h1>
        ${h.headline.trim() ? `<p class="cv-headline">${esc(h.headline)}</p>` : ""}
        ${contacts ? `<p class="cv-contacts">${contacts}</p>` : ""}
      </header>${body}`;
    fitSheet();
  }

  function fitSheet() {
    const frame = $("#sheet-frame"), scaler = $("#sheet-scaler"), sheet = $("#sheet");
    const scale = Math.min(1, frame.clientWidth / sheet.offsetWidth);
    scaler.style.transform = `scale(${scale})`;
    frame.style.height = (sheet.offsetHeight * scale) + "px";
    const pageH = sheet.offsetWidth * 297 / 210;
    const pages = Math.max(1, Math.ceil((sheet.scrollHeight - 2) / pageH));
    $("#page-note").textContent = pages > 1 ? `A4 · circa ${pages} pagine — prova a restare in una` : "A4 · 1 pagina";
  }

  function renderChecks() {
    const { checks, score, skills } = analyse();
    $("#meter-fill").style.width = score + "%";
    $("#score-num").textContent = score + "%";
    const icon = { ok: "✓", warn: "!", bad: "×" };
    $("#checks").innerHTML = checks.map(c => `<li class="${c.state}"><span class="dot" aria-hidden="true">${icon[c.state]}</span><span>${esc(c.text)}${c.note ? `<small>${esc(c.note)}</small>` : ""}</span></li>`).join("");
    document.querySelectorAll("[data-autoskills]").forEach(box => {
      const row = (lbl, type) => skills[type].length ? `<div class="row"><span class="lbl">${lbl}</span>${skills[type].map(x => `<button type="button" class="askill ${type}" data-goto="${x.where[0]}">${esc(x.skill)}</button>`).join("")}</div>` : "";
      box.innerHTML = (row("Hard skills", "hard") + row("Soft skills", "soft")) || `<p class="hint">Ancora nessuna skill: scrivi il primo bullet point guidato in un'esperienza.</p>`;
    });
  }

  function refresh() { renderSheet(); renderChecks(); persist(); }

  /* ---------- eventi ---------- */
  const setPath = (path, val) => {
    const keys = path.split(".");

    cancelAnimationFrame(rafId);

  const move = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };

  $("#editor").addEventListener("click", e => {

      return;

    if (handleBuilderClick(e)) return;
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const { act } = btn.dataset;
    const si = +btn.dataset.si, ii = +btn.dataset.ii;
    switch (act) {
      case "style": cv.meta.style = btn.dataset.style; break;
      case "accent": cv.meta.accent = btn.dataset.color; break;
      case "lang": cv.meta.lang = btn.dataset.lang; break;
      case "field": cv.meta.field = btn.dataset.field; break;
      case "sec-up": move(cv.sections, si, -1); break;
      case "sec-down": move(cv.sections, si, 1); break;
      case "sec-del": {
        const key = "sec:" + cv.sections[si].id;
        if (pendingDelete !== key) { pendingDelete = key; btn.textContent = "Conferma?"; return; }
        cv.sections.splice(si, 1); break;
      }
      case "sec-add": {
        const p = PRESETS[+btn.dataset.preset];
        cv.sections.push(newSection(p.kind, cv.meta.lang === "it" ? p.it : p.en));
        break;

      case "sec-custom": cv.sections.push(newSection(btn.dataset.kind, cv.meta.lang === "it" ? "Nuova sezione" : "New section")); break;
      case "item-add": cv.sections[si].items.push(blankEntry()); break;
      case "item-up": move(cv.sections[si].items, ii, -1); break;
      case "item-down": move(cv.sections[si].items, ii, 1); break;
      case "item-del": {
        const key = "item:" + cv.sections[si].items[ii].id;
        if (pendingDelete !== key) { pendingDelete = key; btn.textContent = "Conferma?"; return; }

  // Formato: solo i campi compilati, con etichette leggibili. L'ultima riga ricorda stile e tipo di sezione.
  const KIND_CODE = { text: "p", entries: "e", skills: "c", list: "l" };
  const CODE_KIND = { p: "text", e: "entries", c: "skills", l: "list" };
  const HEAD_KEYS = [["name", "Nome"], ["headline", "Titolo"], ["email", "Email"], ["phone", "Telefono"], ["city", "Città"], ["links", "Link"]];
  const NO_TITLE = "(ruolo da scrivere)";
  const filled = it => [it.title, it.org, it.place, it.start, it.end, it.bullets].some(x => String(x || "").trim()) || (it.points || []).length;
  function cvToText() {
    const h = cv.header, out = [], codes = [];
    HEAD_KEYS.forEach(([k, label]) => { if (h[k].trim()) out.push(`${label}: ${h[k].trim()}`); });
    cv.sections.forEach(s => {
      const body = [];
      if (s.kind === "text" && s.text.trim()) body.push(s.text.trim());
      if (s.kind === "list") body.push(...lines(s.lines));
      if (s.kind === "skills") { const sk = collectSkills(); if (sk.hard.length) body.push("Hard skills: " + sk.hard.map(x => x.skill).join(", ")); if (sk.soft.length) body.push("Soft skills: " + sk.soft.map(x => x.skill).join(", ")); }
      if (s.kind === "entries") (s.items || []).filter(filled).forEach((it, i) => {
        if (i) body.push("");
        body.push("# " + (it.title.trim() || NO_TITLE));
        if (it.org.trim()) body.push("Presso: " + it.org.trim());
        if (it.place.trim()) body.push("Luogo: " + it.place.trim());
        const dates = [it.start.trim(), it.end.trim()].filter(Boolean).join(" – ");
        if (dates) body.push("Date: " + dates);
        (it.points || []).forEach(x => body.push(`- ${x.skill} (${x.type}): ${x.text}`));
        lines(it.bullets).forEach(b => body.push("- " + b));
      });
      if (!body.length) return; // le sezioni vuote non si copiano
      codes.push(KIND_CODE[s.kind]);
      out.push("", `== ${s.title.trim() || "Sezione"} ==`, ...body);
    });
    out.push("", `(CV Lab · ${cv.meta.style} · ${cv.meta.accent} · ${codes.join("")} · ${cv.meta.field})`);
    return out.join("\n").replace(/^\n+/, "");
  }
  function textToCv(text) {
    const rows = text.replace(/\r/g, "").split("\n").map(r => r.trim());
    const meta = rows.map(r => r.match(/^\(CV Lab · (\w+) · (#[0-9a-f]{6}) · ([pecl]*)(?: · (\w+))?\)$/i)).find(Boolean);
    if (!meta && !rows.some(r => /^==\s.+\s==$/.test(r))) return null;
    const data = blankCV();
    data.sections = [];
    if (meta) { data.meta.style = meta[1]; data.meta.accent = meta[2]; if (meta[4]) data.meta.field = meta[4]; }
    const codes = meta ? meta[3].split("") : [];
    let sec = null, it = null;
    rows.forEach(r => {
      if (!r || /^\(CV Lab · /.test(r)) return;
      const m = r.match(/^==\s(.+)\s==$/);
      if (m) {
        const code = codes[data.sections.length];
        const kind = CODE_KIND[code] || (/skill|competenz/i.test(m[1]) ? "skills" : "list");
        sec = newSection(kind, m[1].trim());
        if (sec.items) sec.items = [];
        it = null;
        data.sections.push(sec);
        return;
      }
      if (!sec) {
        const hk = HEAD_KEYS.find(([, label]) => r.toLowerCase().startsWith(label.toLowerCase() + ":"));
        if (hk) data.header[hk[0]] = r.slice(hk[1].length + 1).trim();
        return;
      }
      if (sec.kind === "text") { sec.text = sec.text ? sec.text + "\n" + r : r; return; }
      if (sec.kind !== "entries") {
        // una sezione senza codice che contiene "# " è in realtà di esperienze
        if (r.startsWith("# ") && !codes.length) { sec.kind = "entries"; sec.items = []; delete sec.lines; }
        else { sec.lines = sec.lines ? sec.lines + "\n" + r : r; return; }
      }
      if (r.startsWith("# ")) {
        const t = r.slice(2).trim();
        it = Object.assign(blankEntry(), { title: t === NO_TITLE ? "" : t });
        sec.items.push(it);
        return;
      }
      if (!it) { it = blankEntry(); sec.items.push(it); }
      const kv = r.match(/^(Presso|Azienda|Luogo|Date):\s*(.*)$/i);
      if (kv) {
        const key = kv[1].toLowerCase();
        if (key === "presso" || key === "azienda") it.org = kv[2];
        if (key === "luogo") it.place = kv[2];
        if (key === "date") { const d = kv[2].split(/\s[–-]\s/); it.start = d[0] || ""; it.end = d[1] || ""; }
        return;
      }
      const b = r.replace(/^[-•]\s*/, "");
      const gp = b.match(/^(.+?) \((hard|soft)\):\s*(.+)$/i);
      if (gp) { it.points.push(pt(gp[2].toLowerCase(), gp[1].trim(), gp[3].trim())); return; }
      it.bullets = it.bullets ? it.bullets + "\n" + b : b;
    });
    data.sections.forEach(x => { if (x.items && !x.items.length) x.items.push(blankEntry()); });
    if (!data.sections.length) data.sections = blankCV().sections;
    return data;
  }

        return;

    });

  $("#btn-notes").addEventListener("click", () => {

    { field: "grafica", type: "hard", skill: "Brand identity", parts: ["Designed a new visual identity", "for a local brand", "turning the client's needs into a clear and consistent style"] },
    { field: "grafica", type: "hard", skill: "Logo design", parts: ["Created a new logo", "for a school project", "moving past the limits of the old one with a modern, minimal design"] },
    { field: "grafica", type: "hard", skill: "Adobe InDesign", parts: ["Laid out a product catalogue", "for a client", "ready for professional printing"] },
    { field: "grafica", type: "soft", skill: "Time management", parts: ["Planned the work on posters and flyers", "for local clients", "always delivering the final files before the deadline"] },
    { field: "grafica", type: "soft", skill: "Teamwork and flexibility", parts: ["Worked with sound technicians, directors and interviewees", "during documentary shoots", "adapting quickly to changes in light, weather or schedule"] },
    { field: "grafica", type: "soft", skill: "Active listening", parts: ["Listened to the company's story", "during a rebranding project", "and turned it into a modern, minimal design"] },
    { field: "meccanica", type: "hard", skill: "CNC machining", parts: ["Set up and used a CNC lathe", "during my internship in a metal parts company", "producing steel parts from technical drawings"] },
    { field: "meccanica", type: "hard", skill: "Technical drawing", parts: ["Drew mechanical components in SolidWorks", "for the technical office", "following ISO standards, ready for production"] },
    { field: "meccanica", type: "hard", skill: "Precision measurement", parts: ["Checked parts with micrometers and calipers", "in the quality control area", "to make sure they matched the required tolerances"] },
    { field: "meccanica", type: "soft", skill: "Problem solving", parts: ["Helped the tutor find the cause of a machine stop", "in the production department", "so that production could restart quickly"] },
    { field: "meccanica", type: "soft", skill: "Teamwork", parts: ["Worked with technicians and other interns", "on a conveyor belt project", "to complete the assembly on time"] },
    { field: "meccanica", type: "soft", skill: "Safety awareness", parts: ["Followed safety procedures", "in the workshop", "keeping the work area clean and organised every day"] }
  ];
  const BVERBS = ["Designed", "Created", "Developed", "Planned", "Managed", "Coordinated", "Produced", "Laid out", "Edited", "Built", "Assembled", "Drew", "Tested", "Checked", "Analysed", "Improved", "Solved", "Worked with", "Presented", "Supported"];
  const exText = x => x.parts[0] + " " + x.parts[1] + (/^(and|so|to)\b/.test(x.parts[2]) ? " " : ", ") + x.parts[2];
  const sigWords = t => norm(t).replace(/[^a-z\s]/g, " ").split(/\s+/).filter(w => w.length > 3);
  // l'esempio che la frase ricalca quasi parola per parola, se c'è
  function copiedFrom(text) {
    const mine = new Set(sigWords(text));
    let best = null, score = 0;
    BEX.forEach(x => {
      const ws = sigWords(exText(x));
      const sc = ws.filter(w => mine.has(w)).length / ws.length;
      if (sc > score) { score = sc; best = x; }
    });
    return score >= 0.6 ? best : null;
  }

  let bld = null; // { itemId, editPi, step, type, skill, verb, what, who, how, text, edited, showEx }
  const findItem = id => { for (const s of cv.sections) for (const it of (s.items || [])) if (it.id === id) return it; return null; };
  const capFirst = t => t ? t[0].toUpperCase() + t.slice(1) : t;
  function bCompose() {
    let core = [bld.verb, bld.what].map(x => x.trim()).filter(Boolean).join(" ");
    if (bld.who.trim()) core += " " + bld.who.trim();
    if (bld.how.trim()) core += (core ? ", " : "") + bld.how.trim();
    return capFirst(core.replace(/\s+/g, " ").replace(/[.\s]+$/, ""));
  }
  const PH = {
    grafica: { what: "a new logo and brand identity", who: "for a local bakery", how: "turning the owner's story into a modern design" },
    meccanica: { what: "a CNC lathe to produce steel parts", who: "during my internship in the turning department", how: "following the technical drawings step by step" }
  };

  function builderHTML(it) {
    const f = cv.meta.field in BSKILLS ? cv.meta.field : "meccanica";
    const sugg = bld.type ? BSKILLS[f][bld.type] : [];
    let ex = BEX.filter(x => x.field === f && (!bld.type || x.type === bld.type));
    const key = norm(bld.skill).slice(0, 4);
    if (key) ex = ex.slice().sort((p, q) => (norm(q.skill).includes(key) ? 1 : 0) - (norm(p.skill).includes(key) ? 1 : 0));
    const id = it.id, ph = PH[f];
    const stepA = `<div class="substep${bld.step > 1 ? " done" : ""}">
        <p class="substep-title">A · Quale skill vuoi dimostrare con questo bullet point?</p>
        <p class="hint">Cerchi il nome inglese di una skill? <button type="button" class="btn small" data-opendict="soft">Apri il dizionario</button></p>
        <div class="typeinfo">
          <button type="button" class="typebtn hard" data-btype="hard" aria-pressed="${bld.type === "hard"}"><b>Hard skill</b><span>Cosa sai fare: programmi, macchine, tecniche.</span></button>
          <button type="button" class="typebtn soft" data-btype="soft" aria-pressed="${bld.type === "soft"}"><b>Soft skill</b><span>Come lavori: con gli altri, con i tempi, con i problemi.</span></button>
        </div>
        ${bld.type ? `<div class="q">
          <label for="bs-${id}">Scrivi la skill o scegline una</label>
          <input id="bs-${id}" data-b="skill" value="${esc(bld.skill)}" placeholder="${bld.type === "hard" ? "Es. Adobe Illustrator" : "Es. Time management"}">
          <div class="bchips">${sugg.map(x => `<button type="button" class="bchip" data-bskill="${esc(x)}" aria-pressed="${norm(bld.skill) === norm(x)}">${esc(x)}</button>`).join("")}</div>
        </div>
        ${bld.step === 1 ? `<div><button class="btn primary small" type="button" data-bact="next" ${bld.skill.trim() ? "" : "disabled"}>Avanti: scrivi la frase</button></div>` : ""}` : ""}
      </div>`;
    if (bld.step === 1) return `<div class="builder"><h3>Nuovo bullet point</h3>${stepA}<div><button class="btn small ghost" type="button" data-bact="cancel">Annulla</button></div></div>`;
    const x = ex.length ? ex[(bld.showEx || 0) % ex.length] : null;
    return `<div class="builder"><h3>${bld.editPi != null ? "Modifica bullet point" : "Nuovo bullet point"} · ${esc(bld.skill)}</h3>${stepA}
      <div class="substep">
        <p class="substep-title">B · Racconta dove si vede “${esc(bld.skill)}”</p>
        <p class="hint">Non sai una parola? <button type="button" class="btn small" data-opendict="verbi">Apri il dizionario</button></p>
        <div class="q">
          <label for="bw-${id}"><b>1.</b> Cosa hai fatto? Scegli un verbo, poi scrivi cosa</label>
          <div class="bchips">${BVERBS.map(v => `<button type="button" class="bchip" data-bverb="${v}" aria-pressed="${bld.verb === v}">${v}</button>`).join("")}</div>
          <input id="bw-${id}" data-b="what" value="${esc(bld.what)}" placeholder="${esc(ph.what)}">
        </div>
        <div class="q">
          <label for="bp-${id}"><b>2.</b> Per chi o in che contesto?</label>
          <input id="bp-${id}" data-b="who" value="${esc(bld.who)}" placeholder="${esc(ph.who)}">
        </div>
        <div class="q">
          <label for="bh-${id}"><b>3.</b> Come l'hai fatto, o a cosa è servito? <span class="hint">(facoltativo)</span></label>
          <input id="bh-${id}" data-b="how" value="${esc(bld.how)}" placeholder="${esc(ph.how)}">
        </div>
        <div class="bresult">
          <label for="bt-${id}">Il tuo bullet point (puoi correggerlo)</label>
          <textarea id="bt-${id}" data-b="text" placeholder="Si compone mentre rispondi alle domande">${esc(bld.text)}</textarea>
          <ul class="btips" id="btips-${id}"></ul>
          <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small primary" type="button" id="bgo-${id}" data-bact="confirm" disabled>${bld.editPi != null ? "Salva bullet point" : "Aggiungi al CV"}</button>
            <button class="btn small ghost" type="button" data-bact="cancel">Annulla</button></div>
        </div>
        <div class="q">
          ${bld.showEx == null || !x
            ? `<div><button class="btn small" type="button" data-bact="showex">Vedi un esempio</button> <span class="hint">serve a capire la struttura, non a copiarla</span></div>`
            : `<div class="exbox">
                <span class="eyebrow">Esempio · ${esc(x.skill)} (${x.type})</span>
                <ol class="exparts"><li><b>Cosa:</b> ${esc(x.parts[0])}</li><li><b>Per chi / dove:</b> ${esc(x.parts[1])}</li><li><b>Come / a cosa è servito:</b> ${esc(x.parts[2])}</li></ol>
                <p class="hint">Ora rispondi alle stesse domande con <b>la tua</b> esperienza.</p>
                <div style="display:flex;gap:6px">${ex.length > 1 ? `<button class="btn small" type="button" data-bact="nextex">Un altro esempio</button>` : ""}<button class="btn small ghost" type="button" data-bact="hideex">Nascondi</button></div>
              </div>`}
        </div>
      </div>
    </div>`;
  }

  function updateBTips() {
    if (!bld) return;
    const ta = document.getElementById("bt-" + bld.itemId);
    if (!ta) return;
    const t = ta.value.trim(), n = t.split(/\s+/).filter(Boolean).length;
    const tips = [];
    const copy = n >= 6 ? copiedFrom(t) : null;
    if (copy) tips.push(["stop", `Questa frase è quasi uguale all'esempio “${copy.skill}”. Racconta la tua esperienza: cosa hai fatto tu, per chi, come.`]);
    if (n < 6) tips.push(["tip", "Rispondi alle domande o scrivi una frase di almeno 6 parole."]);
    else {
      const w = norm(t).split(" ")[0].replace(/[^a-z]/g, "");
      tips.push(ACTION_VERBS.includes(w) || BVERBS.some(v => norm(t).startsWith(norm(v))) || (w.length > 4 && w.endsWith("ed")) ? ["ok", "Inizia con un verbo d'azione."] : ["tip", "Consiglio: inizia con un verbo al passato (Designed, Planned, Checked…)."]);
      tips.push(bld.who.trim() || /\b(for|with|during|at|in)\b/i.test(t) ? ["ok", "Si capisce il contesto."] : ["tip", "Consiglio: aggiungi per chi o dove (for a client, during my internship…)."]);
    }
    document.getElementById("btips-" + bld.itemId).innerHTML = tips.map(([k, m]) => `<li class="${k}">${k === "ok" ? "✓" : k === "stop" ? "✋" : "→"} ${esc(m)}</li>`).join("");
    document.getElementById("bgo-" + bld.itemId).disabled = n < 6 || !!copy;
  }

  function builderInput(el) {
    if (!bld) return;
    const k = el.dataset.b;
    if (k === "skill") {
      bld.skill = el.value;
      document.querySelectorAll("[data-bskill]").forEach(c => c.setAttribute("aria-pressed", norm(c.dataset.bskill) === norm(bld.skill)));
      const nx = document.querySelector('[data-bact="next"]'); if (nx) nx.disabled = !bld.skill.trim();
      return;
    }
    if (k === "text") { bld.text = el.value; bld.edited = el.value.trim() !== bCompose(); updateBTips(); return; }
    bld[k] = el.value;
    if (!bld.edited) { bld.text = bCompose(); const ta = document.getElementById("bt-" + bld.itemId); if (ta) ta.value = bld.text; }
    updateBTips();
  }

  const rerender = focusSel => {
    const y = window.scrollY;
    renderEditor();
    window.scrollTo(0, y);
    if (bld && bld.step === 2) updateBTips();
    if (focusSel) { const el = document.querySelector(focusSel); if (el) el.focus({ preventScroll: true }); }
  };

  function handleBuilderClick(e) {
    const pa = e.target.closest("[data-pact]");
    if (pa) {
      const it = findItem(pa.dataset.item), pi = +pa.dataset.pi;
      if (pa.dataset.pact === "del") { it.points.splice(pi, 1); if (bld && bld.itemId === it.id) bld = null; rerender(); }
      else {
        const x = it.points[pi];
        bld = { itemId: it.id, editPi: pi, step: 2, type: x.type, skill: x.skill, verb: "", what: "", who: "", how: "", text: x.text, edited: true, showEx: null };
        rerender("#bt-" + it.id);
      }
      return true;
    }
    const ba = e.target.closest("[data-bact]");
    if (ba) {
      switch (ba.dataset.bact) {
        case "build": bld = { itemId: ba.dataset.item, editPi: null, step: 1, type: "", skill: "", verb: "", what: "", who: "", how: "", text: "", edited: false, showEx: null }; rerender(); break;
        case "next": if (!bld.skill.trim()) break; bld.step = 2; rerender("#bw-" + bld.itemId); break;
        case "cancel": bld = null; rerender(); break;
        case "showex": bld.showEx = 0; rerender(); break;
        case "nextex": bld.showEx = (bld.showEx || 0) + 1; rerender(); break;
        case "hideex": bld.showEx = null; rerender(); break;
        case "confirm": {
          const it = findItem(bld.itemId);
          const text = document.getElementById("bt-" + bld.itemId).value.trim().replace(/\s+/g, " ").replace(/\.$/, "");
          const data = { type: bld.type, skill: bld.skill.trim(), text };
          if (bld.editPi != null) Object.assign(it.points[bld.editPi], data);
          else it.points.push(Object.assign({ id: uid() }, data));
          const sk = data.skill;
          bld = null; rerender();
          toast(`Aggiunto: ${sk} è nel CV`);
          break;
        }
      }
      return true;
    }
    if (!bld) return false;
    const tb = e.target.closest("[data-btype]");
    if (tb) { bld.type = tb.dataset.btype; bld.step = 1; rerender("#bs-" + bld.itemId); return true; }
    const sk = e.target.closest("[data-bskill]");
    if (sk) { bld.skill = sk.dataset.bskill; rerender(); return true; }
    const vb = e.target.closest("[data-bverb]");
    if (vb) {
      bld.verb = bld.verb === vb.dataset.bverb ? "" : vb.dataset.bverb;
      document.querySelectorAll("[data-bverb]").forEach(c => c.setAttribute("aria-pressed", c.dataset.bverb === bld.verb));
      bld.edited = false; bld.text = bCompose();
      const ta = document.getElementById("bt-" + bld.itemId); if (ta) ta.value = bld.text;
      updateBTips();
      const w = document.getElementById("bw-" + bld.itemId); if (w) w.focus({ preventScroll: true });
      return true;
    }
    return false;
  }

  let dictCat = "", dictQ = "";
  function renderDict() {
    const q = norm(dictQ);
    const list = DICT.filter(d => (!dictCat || d.cat === dictCat) && (!q || norm(d.it + " " + d.en + " " + d.note).includes(q)));
    $("#dict-cats").innerHTML = [["", "Tutto"]].concat(Object.entries(DICT_CATS)).map(([k, v]) => `<button type="button" class="dchip" data-dcat="${k}" aria-pressed="${dictCat === k}">${esc(v)}</button>`).join("");
    $("#dict-count").textContent = list.length === 1 ? "1 parola" : `${list.length} parole`;
    $("#dict-list").innerHTML = list.length ? list.map(d => `<li>
        <div class="dword"><span class="dit">${esc(d.it)}</span><span class="den">${esc(d.en)}</span>${d.note ? `<span class="dnote">${esc(d.note)}</span>` : ""}</div>
        <button type="button" class="btn small" data-dcopy="${esc(d.en)}">Copia</button></li>`).join("")
      : `<li class="dempty">Nessuna parola trovata. Prova a scriverla in un altro modo, o in inglese.</li>`;
  }
  function openDict(cat) {
    if (cat !== undefined) dictCat = cat;
    $("#dict").hidden = false;
    document.body.classList.add("dict-open");
    fitSheet();
    renderDict();
    setTimeout(() => $("#dict-q").focus(), 30);
  }
  function closeDict() { $("#dict").hidden = true; document.body.classList.remove("dict-open"); fitSheet(); }
  $("#btn-dict").addEventListener("click", () => $("#dict").hidden ? openDict() : closeDict());
  $("#dict-close").addEventListener("click", closeDict);
  $("#dict-q").addEventListener("input", e => { dictQ = e.target.value; renderDict(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#dict").hidden && !dlg.open) closeDict(); });
  $("#dict").addEventListener("click", e => {
    const c = e.target.closest("[data-dcat]");
    if (c) { dictCat = c.dataset.dcat; renderDict(); return; }
    const cp = e.target.closest("[data-dcopy]");
    if (cp) {
      const t = cp.dataset.dcopy;
      const done = () => { cp.textContent = "Copiato ✓"; setTimeout(() => { cp.textContent = "Copia"; }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => toast("Copia a mano: " + t));
      else toast("Copia a mano: " + t);
    }
  });
  $("#editor").addEventListener("click", e => { const d = e.target.closest("[data-opendict]"); if (d) openDict(d.dataset.opendict); });

  /* ---------- avvio: CV nuovo, CV salvato o esempio da guardare una volta sola ---------- */
  function setMode(m) {
    mode = m;
    document.body.dataset.mode = m;
    $("#start").hidden = m !== "start";
    $("#viewbar").hidden = m !== "example";
  }
  function enterEdit() {
    setMode("edit");
    bld = null;
    document.body.dataset.view = "edit";
    document.querySelectorAll(".tabs [data-view]").forEach(x => x.setAttribute("aria-pressed", x.dataset.view === "edit"));
    renderEditor();
    window.scrollTo(0, 0);
  }
  // il CV in corso su questo computer, se c'è (gli esempi non contano)
  function savedCv() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      const c = raw && JSON.parse(raw);
      return c && Array.isArray(c.sections) && !c.example ? normalizeCv(c) : null;
    } catch (e) { return null; }
  }
  let confirmNew = false;
  function showStart() {
    const saved = savedCv();
    confirmNew = false;
    cv = blankCV();
    const who = saved && saved.header.name.trim();
    $("#start-options").innerHTML = saved
      ? `<button type="button" class="start-opt primary" data-go="continue"><b>Continua ${who ? "il CV di " + esc(who) : "il tuo CV"}</b><span>Riprendi da dove eri rimasto su questo computer.</span></button>
         <button type="button" class="start-opt" data-go="open"><b>Apri un altro CV salvato</b><span>Il file .json o il testo copiato nelle Note.</span></button>
         <button type="button" class="start-opt" data-go="blank" id="start-new"><b>Inizia un CV nuovo</b><span>Il CV in corso su questo computer verrà cancellato.</span></button>
         <p class="hint">Gli esempi si possono guardare solo prima di iniziare il proprio CV.</p>`
      : `<button type="button" class="start-opt primary" data-go="blank"><b>Inizia un CV nuovo</b><span>Parti da un CV vuoto.</span></button>
         <button type="button" class="start-opt" data-go="open"><b>Apri il mio CV salvato</b><span>Il file .json o il testo copiato nelle Note.</span></button>
         <button type="button" class="start-opt" data-go="example"><b>Guarda un esempio prima di iniziare</b><span>Lo puoi vedere solo adesso: quando inizi a scrivere, gli esempi non saranno più disponibili.</span></button>`;
    setMode("start");
    window.scrollTo(0, 0);
  }
  function showExample(field) {
    cv = freshIds(clone(EXAMPLES[field]));
    cv.example = false;
    setMode("example");
    document.querySelectorAll("[data-ex]").forEach(x => x.setAttribute("aria-pressed", x.dataset.ex === field));
    renderSheet();
    window.scrollTo(0, 0);
  }
  $("#start").addEventListener("click", e => {
    const b = e.target.closest("[data-go]");
    if (!b) return;
    if (b.dataset.go === "continue") { const c = savedCv(); if (c) { cv = c; enterEdit(); } return; }
    if (b.dataset.go === "blank") {
      if (savedCv() && !confirmNew) { confirmNew = true; b.querySelector("span").textContent = "Sicuro? Premi di nuovo: il CV in corso verrà cancellato."; return; }
      cv = blankCV(); enterEdit(); persist();
    }
    if (b.dataset.go === "open") $("#btn-open").click();
    if (b.dataset.go === "example" && !savedCv()) showExample("grafica");
  });
  $("#viewbar").addEventListener("click", e => {
    const x = e.target.closest("[data-ex]");
    if (x) showExample(x.dataset.ex);
  });
  $("#btn-start-mine").addEventListener("click", () => {
    const field = cv.meta.field;
    cv = blankCV(); cv.meta.field = field;
    enterEdit();
    toast("Buon lavoro! Da qui in poi gli esempi non sono più disponibili.");
  });

  showStart();
})();
</script>
